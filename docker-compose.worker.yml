# Optional: run extra ingestion/embedding workers on another machine pointing at the central stack.
# Set PUBLIC_HOST in .env to the LAN IP of the machine running docker compose (redis/postgres/vector-store).
# IMPORTANT: ingestion workers need access to uploaded files path.
# Set SHARED_UPLOADS_DIR to a network/shared directory that mirrors central /uploads.
# Example on Windows: SHARED_UPLOADS_DIR=//SERVER/uploads

services:
  ingestion-worker:
    build:
      context: ./ingestion-worker
      dockerfile: Dockerfile
      args:
        - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-small}
    restart: unless-stopped
    volumes:
      - ${SHARED_UPLOADS_DIR:-./uploads-worker}:/uploads
    environment:
      - REDIS_URL=redis://${PUBLIC_HOST:-localhost}:6379
      - POSTGRES_URL=postgresql://raguser:ragpassword@${PUBLIC_HOST:-localhost}:5432/ragdb
      - EMBEDDING_SERVICE_URL=${EMBEDDING_SERVICE_URL:-http://embedding-worker:8002}
      - UPLOAD_DIR=/uploads
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-small}
      - WHISPER_MODEL_PATH=${WHISPER_MODEL_PATH:-}
      - WHISPER_DOWNLOAD_ROOT=${WHISPER_DOWNLOAD_ROOT:-/models/whisper}
      - WHISPER_LOCAL_ONLY=${WHISPER_LOCAL_ONLY:-1}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_URL=${OLLAMA_URL:-}
      - OLLAMA_VISION_MODEL=${OLLAMA_VISION_MODEL:-llava}
      - GEMINI_VISION_MODEL=${GEMINI_VISION_MODEL:-gemini-2.0-flash}
      - VISION_ORDER=${VISION_ORDER:-ollama_then_gemini}
      - VIDEO_VISUAL_MAX_FRAMES=${VIDEO_VISUAL_MAX_FRAMES:-6}
      - VIDEO_VISUAL_INTERVAL_SEC=${VIDEO_VISUAL_INTERVAL_SEC:-5}
      - INGESTION_CONCURRENCY=${INGESTION_CONCURRENCY:-2}
      - INGESTION_QUEUE_POP_TIMEOUT_SEC=${INGESTION_QUEUE_POP_TIMEOUT_SEC:-2}
      - INGESTION_FILE_RETRY_MAX=${INGESTION_FILE_RETRY_MAX:-6}
      - INGESTION_FILE_RETRY_DELAY_SEC=${INGESTION_FILE_RETRY_DELAY_SEC:-1.5}

  embedding-worker:
    build:
      context: ./embedding-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ${SHARED_UPLOADS_DIR:-./uploads-worker}:/uploads
    environment:
      - REDIS_URL=redis://${PUBLIC_HOST:-localhost}:6379
      - POSTGRES_URL=postgresql://raguser:ragpassword@${PUBLIC_HOST:-localhost}:5432/ragdb
      - VECTOR_STORE_URL=http://${PUBLIC_HOST:-localhost}:8003
      - UPLOAD_DIR=/uploads
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-2}
      - QUERY_EMBED_CONCURRENCY=${QUERY_EMBED_CONCURRENCY:-8}
      - EMBEDDING_QUEUE_POP_TIMEOUT_SEC=${EMBEDDING_QUEUE_POP_TIMEOUT_SEC:-2}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
